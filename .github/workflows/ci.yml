name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CSweet.Isolation.slnx --configuration Release
      - run: dotnet pack CSweet.Isolation.slnx --configuration Release --no-build --output artifacts/packages
